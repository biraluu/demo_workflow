name: Build and Publish image
on:
  push:
    branches:
      - dev
      - main
      - qa
      - stage

    tags: ["v*.*.*"]

env:
  CONTEXT_PATH: .
  DOCKER_PATH: ./Dockerfile
  DOCKER_REPO: xuno-office

jobs:
  publish:
    name: Build and publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        id: login-docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            "${{ steps.login-docker.outputs.registry }}/${{ env.DOCKER_REPO }}"
          tags: |
            type=raw,value={{branch}}-ledger-connect-sha-{{sha}},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver, pattern= {{version}}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKER_PATH }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.tags }}